{% extends "base.html" %}

{% block content %}
    <div class="row">
        <div class="mx-auto col-lg-5">
            <div class="card">
                <div class="card-header"><h2>Anmelden</h2></div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        <div class="form-group">
                            <label for="id_username">Benutzername</label>
                            <input type="text" name="username" class="form-control" autocapitalize="none"
                                   autocomplete="username" maxlength="150" id="id_username">
                        </div>
                        <div class="form-group">
                            <label for="id_password">Passwort</label>
                            <input type="password" name="password" autocomplete="current-password" class="form-control"
                                   id="id_password">
                        </div>
                        <button type="submit" class="btn btn-dark btn-block">Login</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
